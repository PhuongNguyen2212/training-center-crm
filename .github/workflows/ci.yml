name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri (the default `desktop` feature) needs these system libraries to
      # compile on Linux. The headless `server` build does not, but clippy/test
      # below run against the full default-feature build.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      # `generate_context!` (desktop feature) embeds the frontend from ../dist,
      # so the path must exist for clippy/test to compile. A placeholder is
      # enough for compilation checks; the real bundle is built by `tauri build`.
      - name: Provide placeholder frontend dist
        working-directory: .
        run: |
          mkdir -p dist
          printf '<!doctype html><title>ci</title>' > dist/index.html

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build headless server (release)
        run: cargo build --bin server --no-default-features --release

  integration:
    name: Integration (in-memory DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    env:
      # libSQL's call chain is stack-heavy; give test threads a large stack.
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: integration

      # The `db-tests` feature pulls libSQL's local `core` backend, whose build
      # uses bindgen (libclang) + a C compiler. No Tauri/webkit needed here.
      - name: Install build tools (clang for libsql core)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev build-essential

      # Runs the pure unit tests plus the DB-backed *_impl and Axum server
      # integration tests (tests/backend_it.rs, tests/server_it.rs) against an
      # in-memory libSQL database. `--no-default-features` keeps Tauri out.
      - name: DB + server integration tests
        run: cargo test --no-default-features --features db-tests
