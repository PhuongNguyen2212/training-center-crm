[package]
name = "training-center-crm"
version = "0.1.0"
description = "Desktop CRM for managing a training center"
authors = ["Training Center"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# HTTP API server binary (web/mobile backend): `cargo run --bin server`.
[[bin]]
name = "server"
path = "src/bin/server.rs"

# Off-site DB backup (dump Turso -> R2): `cargo run --bin backup`.
[[bin]]
name = "backup"
path = "src/bin/backup.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Used by build.rs to embed the Google service-account key (base64) at build time.
base64 = "0.22"

[dependencies]
# Tauri (desktop GUI) is optional so the `server` binary builds without it
# (no webkit/GUI system deps) — `cargo build --bin server --no-default-features`.
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Data layer — Turso (libSQL) over HTTP, online-only. `remote`+`tls` only (no
# default `core` feature) so it builds pure-Rust, no bindgen/LLVM.
libsql = { version = "0.9", default-features = false, features = ["remote", "tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
# HTTP API server (web/mobile clients talk to this; reuses the command logic).
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Structured logging for the server (request spans, startup, errors). Logs go
# to stdout, which Render/Fly surface in their dashboards.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
bcrypt = "0.19"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
parking_lot = "0.12"
base64 = "0.22"
# Cloudflare R2 (S3-compatible) for payment document files — rustls (no OpenSSL/LLVM).
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
# Google Calendar via service account (JWT bearer auth + REST), rustls.
jsonwebtoken = "10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[features]
default = ["desktop"]
# Desktop app (Tauri GUI). Disable for the headless HTTP server build.
desktop = ["dep:tauri"]
custom-protocol = ["tauri?/custom-protocol"]
# Enables an in-memory libSQL database for DB-backed unit/integration tests
# (`cargo test --features db-tests`). Pulls libsql's `core` (C) backend, which
# needs clang/libclang — so this runs in CI (Linux), not on the LLVM-less dev
# box. The default build stays pure-Rust/remote-only.
db-tests = ["libsql/core"]
